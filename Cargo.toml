[package]
name = "gallery-sorter"
version = "0.2.0"
edition = "2021"
description = "Blazingly fast CLI to organise photos & videos into date folders"
license = "MIT"
readme = "README.md"
repository = "https://github.com/yourusername/gallery-sorter-by-date"
categories = ["command-line-utilities", "filesystem", "multimedia"]

[[bin]]
name = "gallery-sorter"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
rayon = "1"
jwalk = "0.8"
num_cpus = "1"
kamadak-exif = "0.6"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
indicatif = "0.18"
console = "0.16"
humantime = "2"
number_prefix = "0.4"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Copy-on-write copies on APFS / Btrfs / XFS / ReFS. Falls back to a normal
# byte copy on filesystems that don't support reflinks. This is the single
# biggest perf win for the copy phase on supported filesystems.
reflink-copy = "0.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
